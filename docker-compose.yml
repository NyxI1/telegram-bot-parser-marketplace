version: '3.9'

services:
  postgres:
    image: postgres:16
    container_name: price_tracker_db

    environment:
      POSTGRES_DB: price_tracker
      POSTGRES_USER: user
      POSTGRES_PASSWORD: 1234

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d price_tracker"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: telegram_bot_app

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/price_tracker
      DB_USER: user
      DB_PASSWORD: 1234

volumes:
  postgres_data: