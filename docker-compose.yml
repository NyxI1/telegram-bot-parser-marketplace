version: '3.9'

services:
  postgres:
    image: postgres:16

    container_name: price_tracker_db

    environment:
      POSTGRES_DB: price_tracker
      POSTGRES_USER: user
      POSTGRES_PASSWORD: 1234

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: